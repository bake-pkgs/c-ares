[package]
name = "c-ares"
version = "1.34.8"
type = "lib"

[language]
c = "c17"

[dependencies]
upstream = { url = "https://github.com/c-ares/c-ares/releases/download/v1.34.8/c-ares-1.34.8.tar.gz" }

# Mirrors c-ares' CMake platform setup. Windows uses upstream's
# config-win32.h; Unix targets use config/ares_config.h.
[target."*-apple-darwin"]
defines = ["HAVE_CONFIG_H", "_DARWIN_C_SOURCE"]
libraries = ["pthread"]

[target."*-linux-musl"]
defines = ["HAVE_CONFIG_H", "_GNU_SOURCE", "_POSIX_C_SOURCE=200809L", "_XOPEN_SOURCE=700"]
libraries = ["pthread"]

[target."*-linux-gnu"]
defines = ["HAVE_CONFIG_H", "_GNU_SOURCE", "_POSIX_C_SOURCE=200809L", "_XOPEN_SOURCE=700"]
libraries = ["pthread"]

[target."*-windows-gnu"]
defines = ["WIN32_LEAN_AND_MEAN", "_WIN32_WINNT=0x0602", "_CRT_SECURE_NO_DEPRECATE", "_CRT_NONSTDC_NO_DEPRECATE"]
public_defines = ["CARES_STATICLIB"]
libraries = ["ws2_32", "advapi32", "iphlpapi"]
